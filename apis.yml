aid: connect-rpc
name: Connect-RPC
description: >-
  Connect is a slim library for building browser and gRPC-compatible HTTP APIs.
  It supports Protocol Buffers and generates type-safe clients and handlers in
  Go, TypeScript, Swift, and Kotlin, bridging gRPC and web-standard protocols
  with a simple, idiomatic developer experience.
